name: Daily activity digest

# Emails a summary of the day's completed checklist items to the
# distribution list, at the end of that day. Runs on GitHub's servers, so no Cloud Function and no
# Firebase Blaze plan is needed.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   FIREBASE_SERVICE_ACCOUNT  the whole service account JSON file, pasted in
#   SMTP_HOST                 e.g. smtp.gmail.com
#   SMTP_USER                 the sending mailbox
#   SMTP_PASS                 that mailbox's app password
#   DIGEST_TO                 recipients, comma-separated
#
# Optional repository variables (same page, "Variables" tab):
#   SMTP_PORT                 defaults to 465
#   DIGEST_FROM               defaults to SMTP_USER
#   DIGEST_TZ                 defaults to America/New_York
#   DIGEST_ROLLOVER_HOUR      defaults to 8; only applies when reporting today
#   DIGEST_APP_URL            defaults to the hosted dashboard

on:
  schedule:
    # 12:17 UTC = 8:17am Eastern in summer, 7:17am in winter, reporting the
    # previous day. GitHub cron has no timezone support, so the time shifts by
    # an hour across daylight saving.
    #
    # A morning run reporting yesterday is deliberately robust: GitHub starts
    # these jobs hours late (observed six hours against an earlier schedule),
    # and every hour of the day has the same unambiguous "yesterday". Even a
    # six-hour delay to mid-afternoon still sends the correct day.
    #
    # Scheduled at :17 rather than :00 because the top of the hour is the most
    # contended slot on GitHub's scheduler.
    #
    # Runs every day rather than weekdays only: days with no activity send no
    # email, so quiet weekends stay silent on their own, and work done on a
    # Saturday still gets reported on Sunday.
    - cron: '17 12 * * *'
  workflow_dispatch:
    inputs:
      days_ago:
        description: 'Which day to report (1 = yesterday, 0 = today so far)'
        required: false
        default: '1'
      dry_run:
        description: 'Preview only - print the email without sending it'
        type: boolean
        required: false
        default: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Send digest
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          DIGEST_FROM: ${{ vars.DIGEST_FROM }}
          DIGEST_TZ: ${{ vars.DIGEST_TZ }}
          DIGEST_ROLLOVER_HOUR: ${{ vars.DIGEST_ROLLOVER_HOUR }}
          DIGEST_APP_URL: ${{ vars.DIGEST_APP_URL }}
        run: |
          node scripts/daily-digest.js \
            ${{ github.event.inputs.days_ago != '' && format('--days-ago={0}', github.event.inputs.days_ago) || '' }} \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
